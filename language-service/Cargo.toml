[package]
name = "bit8-language-server"
version = "0.1.0"
edition = "2024"
description = "Experimental editor-independent language service for Bit8"
license = "MIT"

[[bin]]
name = "bit8-language-server"
path = "src/main.rs"

[dependencies]
bit8 = { path = ".." }
lsp-server = "0.7.8"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
serde_json = "1.0.151"
